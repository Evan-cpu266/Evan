  function frame(now){if(lastFrame!==null&&animation&&!document.hidden&&$('modalOverlay').hidden){const dt=Math.min(.05,(now-lastFrame)/1000);if(animation==='secant'){state.params.h=Math.sign(state.params.h)*Math.max(.00001,Math.abs(state.params.h)*Math.exp(-1.35*dt));if(Math.abs(state.params.h)<=.000010001){animation=null;save();}}else{state.params.limitH=Math.max(.00001,state.params.limitH*Math.exp(-1.35*dt));if(state.params.limitH<=.000010001){animation=null;save();}}refresh();draw();}lastFrame=now;requestAnimationFrame(frame);}
  $('mainNav').addEventListener('click',ev=>{const target=ev.target.closest('[data-view]');if(target){choice=null;wrong=false;go(target.dataset.view);}});
  $('homeButton').addEventListener('click',()=>go('graph'));$('settingsButton').addEventListener('click',settingsDialog);$('downloadButton').addEventListener('click',downloadLab);$('modalClose').addEventListener('click',closeModal);$('modalOverlay').addEventListener('click',ev=>{if(ev.target===$('modalOverlay'))closeModal();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){animation=null;save();}lastFrame=null;refresh();});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.settings.theme==='auto'){applySettings();draw();}});
  document.addEventListener('keydown',ev=>{if($('modalOverlay').hidden)return;if(ev.key==='Escape'){ev.preventDefault();closeModal();}if(ev.key==='Tab'){const list=Array.from($('modalOverlay').querySelectorAll('button,input,textarea,select,[tabindex]')).filter(n=>!n.disabled&&!n.hidden&&n.tabIndex!==-1),first=list[0],last=list.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}});
  window.CalcLab=Object.freeze({inspect:()=>({view,state:clone(state),settings:clone(state.settings),model:{preset:state.params.preset,expression:state.params.expression,evaluation:model.evaluate(state.params.point)},metrics:calculate(),geometry:plot?.getGeometry()||null,animation,storage:{key:storageKey,available:storageOK}})});
  applySettings();go('graph');requestAnimationFrame(frame);
})();
