<script>/* Asterion Field Station — deterministic SI physics and measurement models. */
(function (root, factory) {
  'use strict';
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;

})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const PI = Math.PI, FOUR_PI_SQUARED = 4 * PI * PI;

  function finite(value, name) {
    if (typeof value !== 'number' || !Number.isFinite(value)) throw new TypeError(name + ' must be a finite number.');
    return value;
  }
  function positive(value, name) {
    finite(value, name);
    if (!(value > 0)) throw new RangeError(name + ' must be greater than zero.');
    return value;
  }
  function nonnegative(value, name) {
    finite(value, name);
    if (value < 0) throw new RangeError(name + ' cannot be negative.');
    return value;
  }
  function assertFiniteValues(values) {
    if (!values.every(Number.isFinite)) throw new RangeError('Choose smaller values; the calculation exceeded its numerical range.');
  }
  function pendulumOptions(options = {}) {
    return {
      length: positive(options.length ?? 1, 'Pendulum length'),
      g: positive(options.g ?? 9.81, 'Gravity'),
      damping: nonnegative(options.damping ?? 0, 'Angular damping'),
      mass: positive(options.mass ?? 1, 'Mass')
    };
  }

  /** Nonlinear pendulum: theta'' = -(g/L) sin(theta) - damping theta'.
   * theta is radians from the downward vertical; damping has units s^-1.
   * RK4 is substepped to at most 1/240 s and 1/80 natural timescales.
   */
  function pendulumStep(state, dt, options = {}) {
    if (!state || typeof state !== 'object') throw new TypeError('A pendulum state is required.');
    let theta = finite(state.theta, 'Angle'), omega = finite(state.omega, 'Angular velocity');
    const time = nonnegative(state.time ?? 0, 'Time'), p = pendulumOptions(options);
    nonnegative(dt, 'Time step');
    if (dt > 10) throw new RangeError('Advance the pendulum with time steps of 10 seconds or less.');
    if (dt === 0) return { theta, omega, time };
    const maximum = Math.min(1 / 240, Math.sqrt(p.length / p.g) / 80);
    const count = Math.max(1, Math.ceil(dt / maximum));
    if (!Number.isFinite(count) || count > 100000) throw new RangeError('The requested pendulum is too stiff for this time step.');
    const h = dt / count, ratio = p.g / p.length;
    const acceleration = (a, v) => -ratio * Math.sin(a) - p.damping * v;
    for (let i = 0; i < count; i++) {
      const a1 = omega, v1 = acceleration(theta, omega);
      const a2 = omega + h * v1 / 2, v2 = acceleration(theta + h * a1 / 2, omega + h * v1 / 2);
      const a3 = omega + h * v2 / 2, v3 = acceleration(theta + h * a2 / 2, omega + h * v2 / 2);
      const a4 = omega + h * v3, v4 = acceleration(theta + h * a3, omega + h * v3);

      omega += h * (v1 + 2 * v2 + 2 * v3 + v4) / 6;

  }

  function pendulumEnergy(state, options = {}) {
    const theta = finite(state?.theta, 'Angle'), omega = finite(state?.omega, 'Angular velocity');
    const p = pendulumOptions(options);
    const kinetic = .5 * p.mass * p.length * p.length * omega * omega;
    const potential = p.mass * p.g * p.length * (1 - Math.cos(theta));
    assertFiniteValues([kinetic, potential]);
    return { kinetic, potential, total: kinetic + potential };
  }

  function pendulumPosition(state, options = {}) {
    const theta = finite(state?.theta, 'Angle'), omega = finite(state?.omega, 'Angular velocity');
    const length = positive(options.length ?? 1, 'Pendulum length');
    return { x: length * Math.sin(theta), y: -length * Math.cos(theta),
      vx: length * omega * Math.cos(theta), vy: length * omega * Math.sin(theta),
      height: length * (1 - Math.cos(theta)), speed: length * Math.abs(omega) };

  function amplitudeAGM(amplitude) {
    finite(amplitude, 'Release amplitude');
    if (Math.abs(amplitude) >= PI) throw new RangeError('A swinging pendulum needs a release amplitude below 180 degrees.');
    let a = 1, b = Math.cos(Math.abs(amplitude) / 2);

  }

  /** Exact undamped libration period evaluated by the arithmetic-geometric
   * mean form of the complete elliptic integral. At amplitude=0 this is the
   * small-angle limiting period, 2 pi sqrt(L/g), rather than an oscillation
   * physically occurring from rest at exactly zero amplitude.
   */
  function pendulumPeriod(length, g = 9.81, amplitude = 0) {
    positive(length, 'Pendulum length'); positive(g, 'Gravity');
    const result = 2 * PI * Math.sqrt(length / g) / amplitudeAGM(amplitude);
    assertFiniteValues([result]); return result;
  }

  function projectileOptions(options = {}) {
    return { speed: nonnegative(options.speed ?? 10, 'Launch speed'), angle: finite(options.angle ?? PI / 4, 'Launch angle'),
      height: nonnegative(options.height ?? 0, 'Launch height'), g: positive(options.g ?? 9.81, 'Gravity'),
      mass: positive(options.mass ?? 1, 'Mass') };
  }

  /** Point projectile, level ground, constant vertical g, no air resistance.
   * The simulation ends at first contact; no bounce/post-impact model is made.
   */
  function projectileFlight(options = {}) {
    const p = projectileOptions(options), vx = p.speed * Math.cos(p.angle), vy = p.speed * Math.sin(p.angle);
    const root = Math.sqrt(vy * vy + 2 * p.g * p.height);
    const time = vy < 0 ? (p.height === 0 ? 0 : 2 * p.height / (root - vy)) : (vy + root) / p.g;
    const range = vx * time, impactVy = vy - p.g * time;
    const apexTime = Math.max(0, vy / p.g), apexHeight = p.height + Math.max(0, vy) ** 2 / (2 * p.g);
    assertFiniteValues([time, range, impactVy, apexTime, apexHeight]);
    return { time, flightTime: time, range, apexTime, apexHeight,
      initial: { x: 0, y: p.height, vx, vy },
      impact: { x: range, y: 0, vx, vy: impactVy, speed: Math.hypot(vx, impactVy) } };
  }

  function projectileState(time, options = {}) {
    nonnegative(time, 'Time');
    const p = projectileOptions(options), flight = projectileFlight(p), t = Math.min(time, flight.time);
    const landed = time >= flight.time, vx = flight.initial.vx, vy = flight.initial.vy - p.g * t;
    const x = vx * t, y = landed ? 0 : Math.max(0, p.height + flight.initial.vy * t - .5 * p.g * t * t);
    const kinetic = .5 * p.mass * (vx * vx + vy * vy), potential = p.mass * p.g * y;
    assertFiniteValues([x, y, vx, vy, kinetic, potential]);
    return { x, y, vx, vy, time: t, speed: Math.hypot(vx, vy), phase: landed ? 'landed' : 'flight',
      energies: { kinetic, potential, total: kinetic + potential } };
  }

  /** Incline followed by horizontal ground. The same coefficient is used for
   * static and kinetic friction as an explicit classroom simplification.
   * No impact-energy loss is added at the ideal smooth ramp/ground transition.
   * s is distance down the incline; distance additionally includes the coast.
   */
  function railState(time, options = {}) {
    nonnegative(time, 'Time');
    const angle = finite(options.angle ?? PI / 9, 'Incline angle');
    if (angle < 0 || angle >= PI / 2) throw new RangeError('Choose an incline from 0 degrees up to, but not including, 90 degrees.');
    const length = positive(options.length ?? options.rampLength ?? 3, 'Ramp length');
    const mu = nonnegative(options.mu ?? .12, 'Friction coefficient'), g = positive(options.g ?? 9.81, 'Gravity');
    const mass = positive(options.mass ?? 1, 'Mass'), sine = Math.sin(angle), cosine = Math.cos(angle);

      const bottomSpeed = Math.sqrt(2 * acceleration * length);
      if (time < rampTime) { s = .5 * acceleration * time * time; v = acceleration * time; phase = 'ramp'; }
      else {
        s = length;
        const after = time - rampTime;
        if (mu === 0) { coastDistance = bottomSpeed * after; v = bottomSpeed; phase = 'coast'; }
        else {
          const coastStop = bottomSpeed / (mu * g), elapsed = Math.min(after, coastStop);
          stopTime = rampTime + coastStop;
          coastDistance = Math.max(0, bottomSpeed * elapsed - .5 * mu * g * elapsed * elapsed);
          v = Math.max(0, bottomSpeed - mu * g * elapsed);
          phase = after >= coastStop ? 'stopped' : 'coast';

    const kinetic = .5 * mass * v * v, potential = mass * g * height;

      acceleration: phase === 'ramp' ? acceleration : phase === 'coast' ? -mu * g : 0,
      rampTime, stopTime, energies: { kinetic, potential, dissipated, mechanical: kinetic + potential,
        total: kinetic + potential + dissipated, initial } };
  }

  function readPoints(points) {
    if (!Array.isArray(points) || points.length < 2 || points.length > 10000) throw new RangeError('Use between 2 and 10000 data points.');
    return points.map((point, index) => {
      const x = Array.isArray(point) ? point[0] : point?.x, y = Array.isArray(point) ? point[1] : point?.y;
      return [finite(x, 'Point ' + (index + 1) + ' x'), finite(y, 'Point ' + (index + 1) + ' y')];

   * errors from residual scatter, not instrument accuracy or a universal error.
   */
  function linearRegression(points) {

    let xx = 0, xy = 0, yy = 0;

    if (!(xx > 0)) throw new RangeError('Change the independent variable: the x values cannot all be the same.');

    const residuals = rows.map(([x, y]) => y - (meanY + slope * (x - meanX)));
    const residualSSE = residuals.reduce((sum, e) => sum + e * e, 0);
    const residualStdError = n > 2 ? Math.sqrt(residualSSE / (n - 2)) : null;
    const standardErrorSlope = residualStdError === null ? null : residualStdError / Math.sqrt(xx);
    const standardErrorIntercept = residualStdError === null ? null : residualStdError * Math.sqrt(1 / n + meanX * meanX / xx);
    assertFiniteValues([meanX, meanY, xx, slope, intercept, residualSSE]);
    return { n, slope, intercept, rSquared: yy > 0 ? Math.max(0, Math.min(1, 1 - residualSSE / yy)) : null,
      residualSSE, residuals, residualStdError, standardErrorSlope, standardErrorIntercept,
      meanX, meanY, xMin: Math.min(...rows.map(p => p[0])), xMax: Math.max(...rows.map(p => p[0])),
      distinctX: new Set(rows.map(p => p[0])).size };
  }

  function tCritical95(df) {
    const table = [null, 12.706204736, 4.302652730, 3.182446305, 2.776445105, 2.570581836,
      2.446911851, 2.364624252, 2.306004135, 2.262157163, 2.228138852, 2.200985160,
      2.178812830, 2.160368656, 2.144786688, 2.131449546, 2.119905299, 2.109815578,
      2.100922040, 2.093024054, 2.085963447, 2.079613845, 2.073873068, 2.068657610,
      2.063898562, 2.059538553, 2.055529439, 2.051830516, 2.048407142, 2.045229642, 2.042272456];

  }

  /** Arrays are [length in m, PERIOD SQUARED in s^2]. Alternatively give
   * objects {length,period,amplitude?}; amplitude is radians. Raw T^2 versus L
   * is the default classroom fit. amplitudeCorrection=true uses the exact
   * nonlinear model to convert each object's period to its small-angle limit.
   */
  function gravityEstimate(measurements, options = {}) {
    if (!Array.isArray(measurements) || measurements.length < 3) throw new RangeError('Collect at least three period measurements before fitting gravity.');
    const corrected = options.amplitudeCorrection === true;

      if (Array.isArray(item)) {
        if (corrected) throw new TypeError('Amplitude correction needs records containing length, period and amplitude.');

      }

      interval95: { low: FOUR_PI_SQUARED / highSlope, high: lowSlope > 0 ? FOUR_PI_SQUARED / lowSlope : null },
      slope: fit.slope, intercept: fit.intercept, rSquared: fit.rSquared, fit,

  }

   */

    const cycles = options.cycles ?? 8;

    const resolution = positive(options.resolution ?? .001, 'Stopwatch resolution');

  }

    openModal('Make the lab yours',[p('The world clock is paused while this dialog is open. Simulation speed changes playback only; measurements remain in model seconds.'),el('div',{class:'settings-grid'},choice('simulationSpeed','Simulation playback','speed',[[1,'1× · real time'],[2,'2× · standard'],[4,'4× · fast observations']]),choice('appearance','Appearance','appearance',[['station','Field station · midnight'],['daylight','Daylight · paper']]),choice('readingSize','Reading size','reading',[['normal','Standard'],['large','Larger']]),check('showVectors','Show velocity / force vectors','showVectors'),check('reduceMotion','Reduce decorative motion','reduceMotion')),p('All three experiments run without accounts, AI or API credits. Your notes stay in this browser unless you download or share them.','scientific-note'),btn('Backup / restore notebook',backupDialog,'secondary'),btn('Done',()=>{closeModal();if(view==='pendulum')renderEvidence();else if(view==='notebook')go(view);},'primary')]);
  }
  function backupDialog(){
    const area=el('textarea',{id:'backupText',rows:8,'aria-label':'Notebook JSON for backup or restore'});area.value=JSON.stringify(data,null,2);
    const restore=()=>{try{if(area.value.length>500000)throw Error('Backup is too large.');const raw=JSON.parse(area.value);if(raw.version!==1)throw Error('This is not an Asterion notebook backup.');data=clean(raw);save();applySettings();pend={theta:data.params.pendulum.amplitude*RAD,omega:0,time:0};measurement=null;flightConfig=null;flight=null;flightTime=0;flightHistory=[];flightLogged=false;railConfig=null;rail=null;railTime=0;railReady=false;railRecorded=false;running=false;closeModal();go('notebook');toast('Notebook restored. Outcomes are recalculated from valid evidence.');}catch(error){status.textContent='Could not restore: '+error.message;}};
    const file=el('input',{id:'importFile',type:'file',accept:'.json,application/json',onchange:async ev=>{const f=ev.target.files[0];if(f){if(f.size>500000){status.textContent='Choose a notebook smaller than 500 KB.';return;}area.value=await f.text();status.textContent='File loaded. Review it, then choose Restore notebook.';}}});
    const status=el('p',{role:'status',class:'feedback'});
    openModal('Your portable field notebook',[p('Download JSON as a backup, or paste a previous backup below and restore it. Restoring replaces this browser’s current notebook; download a backup first if you want to keep both.'),btn('Download JSON backup',()=>download('Asterion-Notebook.json',JSON.stringify(data,null,2),'application/json'),'secondary'),el('div',{class:'control-field'},el('label',{for:'importFile'},'Choose a backup file'),file),area,el('div',{class:'lab-actions'},btn('Select all text',()=>{area.focus();area.select();},'ghost'),btn('Restore notebook',restore,'primary')),status]);
  }
  function advance(dt){
    if(!running||!Number.isFinite(dt)||dt<=0)return;
    let left=Math.min(dt,120),changed=false;
    while(left>1e-9&&running){
      const step=Math.min(left,1/120);left-=step;
      if(view==='pendulum'){
        const old=pend;pend=P.pendulumStep(pend,step,{length:data.params.pendulum.length,g:G,damping:0,mass:1});
        if(measurement && old.theta>0 && pend.theta<=0){
          const cross=old.time+(pend.time-old.time)*old.theta/(old.theta-pend.theta);measurement.crossings.push(cross);
          if(measurement.crossings.length===4){
            const elapsed=Math.round((cross-measurement.crossings[0])*100)/100;
            data.trials.push({id:uid(),length:measurement.length,angleDegrees:measurement.angleDegrees,cycles:3,elapsed,period:elapsed/3,periodUncertainty:.01/3,createdAt:Date.now()});
            measurement=null;running=false;changed=true;save();setFeedback('Three complete periods recorded. Change the length, then collect another trial.',true);toast('Timing trial saved to your field notebook.');
          }
        }
      } else if(view==='trajectory'&&flightConfig){
        flightTime+=step;flight=P.projectileState(flightTime,flightConfig);
        if(!flightHistory.length||flightTime-(flightHistory.at(-1).time||0)>.05||flight.phase==='landed')flightHistory.push({x:flight.x,y:flight.y,time:flight.time});
        if(flight.phase==='landed'&&!flightLogged){
          running=false;flightLogged=true;const f=P.projectileFlight(flightConfig),hit=Math.abs(f.range-TARGET)<=PAD/2;
          data.launches.push({speed:flightConfig.speed,angleDegrees:flightConfig.angle/RAD,height:1,targetX:TARGET,targetWidth:PAD,assumedGravity:flightConfig.assumedGravity,actualGravity:G,actualRange:f.range,flightTime:f.time,error:f.range-TARGET,impactSpeed:f.impact.speed,success:hit,createdAt:Date.now()});data.launches=data.launches.slice(-40);save();changed=true;
          setFeedback((hit?'Target reached! ':'Target missed. ')+'Range '+num(f.range,5)+' m · error '+num(f.range-TARGET,4)+' m · impact speed '+num(f.impact.speed,4)+' m/s.'+(hit&&!achievements().gravity?' Complete Gravity bay to link this hit to your measured evidence.':''),hit);
          document.querySelectorAll('#launchSpeed,#launchAngle,#plannerGravity').forEach(n=>n.disabled=false);
        }
      } else if(view==='energy'&&railConfig){
        const first=P.railState(0,railConfig);railTime=Math.min(railTime+step,first.rampTime);rail=P.railState(railTime,railConfig);
        if(railTime>=first.rampTime){railReady=true;running=false;setFeedback('At the base. Capture this budget, then compare a run with different friction.',true);}
      }else running=false;
    }
    if(changed){if(view==='pendulum')renderEvidence();else if(view==='trajectory')renderFlightLog();updateProgress();}
    refresh();draw();
  }
  function refresh(){
    const set=(id,text)=>{if($(id))$(id).textContent=text;};
    set('pauseSimulation',running?'Pause':'Resume');set('stageStatus',running?'RUNNING · '+data.settings.speed+'× PLAYBACK':'PAUSED · MODEL TIME FROZEN');
    if(view==='pendulum'){
      set('liveAngle',(pend.theta/RAD).toFixed(1)+'°');set('liveTime',pend.time.toFixed(2)+' s');set('liveCycles',measurement?(measurement.crossings.length?Math.min(3,measurement.crossings.length-1)+' / 3 cycles':'Armed'):'Idle');set('liveBobSpeed',num(Math.abs(pend.omega*data.params.pendulum.length),3)+' m/s');
      if($('recordPeriod'))$('recordPeriod').disabled=!!measurement;
    }else if(view==='trajectory'){
      const f=flight || P.projectileState(0,trajectoryCfg());set('flightX',num(f.x,4)+' m');set('flightY',num(f.y,4)+' m');set('flightT',num(f.time,4)+' s');set('flightV',num(f.speed,4)+' m/s');
      const pred=P.projectileFlight({...trajectoryCfg(),g:plannerG});
      if($('predictionReadout'))$('predictionReadout').replaceChildren(el('div',{class:'report-metric'},el('strong',{},num(pred.range,5)+' m'),el('span',{},'Predicted range · planner g = '+num(plannerG,5))),el('div',{class:'report-metric'},el('strong',{},num(pred.time,4)+' s'),el('span',{},'Predicted flight time')));
      if($('launchProbe'))$('launchProbe').disabled=!!(flightConfig&&!flightLogged);
    }else if(view==='energy'){
      const r=rail || P.railState(0,railCfg()),e=r.energies;set('railSpeed',num(r.speed,4)+' m/s');set('railHeight',num(r.height,4)+' m');set('railDissipated',num(e.dissipated,4)+' J');set('railTotal',num(e.total,5)+' J');
      for(const key of ['kinetic','potential','dissipated']){set('energy-'+key,num(e[key],4)+' J');if($('bar-'+key))$('bar-'+key).style.width=(e.initial?Math.max(0,Math.min(100,e[key]/e.initial*100)):0)+'%';}
      if($('captureEnergy'))$('captureEnergy').disabled=!railReady||railRecorded;
    }
  }
  function draw(){
    if(!renderer)return;const settings={showVectors:data.settings.showVectors,reduceMotion:data.settings.reduceMotion};
    if(view==='pendulum')renderer.render('pendulum',pend,{...settings,length:data.params.pendulum.length,g:G,mass:1});
    else if(view==='trajectory'){const cfg=flightConfig||trajectoryCfg();renderer.render('projectile',flight||P.projectileState(0,cfg),{...settings,...cfg,targetX:TARGET,targetWidth:PAD,history:flightHistory,prediction:plannedPath(),showPrediction:true});}
    else if(view==='energy'){const cfg=railConfig||railCfg();renderer.render('rail',rail||P.railState(0,cfg),{...settings,...cfg});}
  }
  function frame(now){if(lastFrame!==null&&running&&!document.hidden)advance(Math.min(.05,(now-lastFrame)/1000)*data.settings.speed);lastFrame=now;requestAnimationFrame(frame);}
  document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;lastFrame=null;refresh();}});
  $('mainNav').addEventListener('click',ev=>{const n=ev.target.closest('[data-view]');if(n)go(n.dataset.view);});
  $('siteHome').addEventListener('click',()=>go('mission'));$('settingsButton').addEventListener('click',settingsDialog);$('downloadButton').addEventListener('click',downloadLab);$('modalClose').addEventListener('click',closeModal);
  $('modalOverlay').addEventListener('click',ev=>{if(ev.target===$('modalOverlay'))closeModal();});
  document.addEventListener('keydown',ev=>{
    if(!$('modalOverlay').hidden){if(ev.key==='Escape')closeModal();if(ev.key==='Tab'){const nodes=Array.from($('modalOverlay').querySelectorAll('button,input,select,textarea,[tabindex]')).filter(n=>!n.disabled&&!n.hidden),first=nodes[0],last=nodes.at(-1);if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}}
    else if(ev.code==='Space'&&ev.target===$('simCanvas')){ev.preventDefault();$('pauseSimulation')?.click();}
  });
  window.AsterionStation=Object.freeze({inspect:()=>({view,running,scene:view==='trajectory'?'projectile':view==='energy'?'rail':view,state:clone(data),settings:clone(data.settings),storage:{key:storageKey,available:storageOK},trialCounts:{pendulum:data.trials.length,launches:data.launches.length,energy:data.energyTrials.length},model:clone({g:G,pendulum:pend,measurement,flight,flightConfig,rail,railConfig,railReady,railRecorded}),achievements:achievements(),geometry:renderer?.getGeometry?.()||null}),advance:seconds=>advance(Math.min(120,Math.max(0,Number(seconds)||0)))});
  applySettings();go('mission');requestAnimationFrame(frame);
})();
